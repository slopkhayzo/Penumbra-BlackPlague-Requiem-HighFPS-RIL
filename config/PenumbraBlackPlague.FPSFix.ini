; PenumbraBlackPlague.FPSFix configuration
; Keep this file beside PenumbraBlackPlague.FPSFix.asi.
; One ASI and one INI serve both Penumbra.exe (Black Plague) and Requiem.exe.

[General]
; false turns the whole plugin off; the game then runs exactly as stock.
Enabled = true
Diagnostics = true

[Telemetry]
; Writes a statistics block to PenumbraBlackPlague.FPSFix.log every
; ReportIntervalSeconds. Leave off for normal play (the log grows by several
; megabytes per hour); turn on when reporting a problem.
Enabled = false
MotionTrace = false
ReportIntervalSeconds = 5

[Features]
; Render at the display rate while game logic and physics stay at 60 Hz.
; Use VSync or an external limiter to cap the frame rate.
RenderUnlock = true
; Reserved; not implemented.
PresentationLimiter = false
CameraInterpolation = true
HandsRootInterpolation = true
WorldRootInterpolation = true
HandsPoseInterpolation = true
WorldPoseInterpolation = true
RagdollPoseInterpolation = true
ParticleInterpolation = true
ImageTrailTiming = true
; Off until it has been exercised in play: the games ship with motion blur
; disabled, so this path has not run yet.
MotionBlurTiming = false
; Mouse look at the display rate instead of 60 Hz.
MouseOverlay = true
; Equal X/Y angular sensitivity while preserving the stock Y sensitivity.
; Stock turns faster horizontally than vertically on widescreen displays;
; set to false to keep that stock behavior.
MouseAxisCorrection = true
; Smooth the in-world hand/item cursor in interaction states without changing
; its fixed-rate gameplay position.
InteractionCursorInterpolation = true
; Preview main-menu and in-game UI cursor positions at presentation rate while
; leaving hover, clicks, dragging state, and authoritative positions fixed-step.
GuiMouseOverlay = true

[Timing]
; Reserved; not implemented.
TargetFPS = 0

; Optional per-game overrides. A key placed in one of these sections replaces
; the same key in [Features] for that game only.
[BlackPlague]

[Requiem]
; Image-trail effects have not occurred in Requiem testing yet.
ImageTrailTiming = false
